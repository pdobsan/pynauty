[tool.cibuildwheel]
build = "cp3{10,11,12,13,14,15}-manylinux_x86_64"
test-requires = ["pytest"]
test-command = "python -m pytest --pyargs pynauty -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
environment = { NAUTY_CONFIGURE_ARGS = "--enable-generic --disable-popcnt --disable-clz" }
