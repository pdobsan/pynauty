name: Upload to PyPi.org

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os:
        - ubuntu-latest
        - macos-latest
        
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      if: runner.os != 'Linux'
      run: |
        python -m pip install --upgrade pip
        make -f Makefile.dist tools
    - name: Build packages
      if: runner.os != 'Linux'
      run: make -f Makefile.dist packages
    - name: Select Linux wheel
      if: runner.os == 'Linux'
      run: |
        python -c 'import sys; print("CIBW_BUILD=cp%d%d-manylinux_x86_64" % sys.version_info[:2])' >> "$GITHUB_ENV"
    - name: Build and test Linux wheel
      if: runner.os == 'Linux'
      uses: pypa/cibuildwheel@v4.3.2
      with:
        config-file: cibuildwheel.toml
        output-dir: dist
    - name: Install publishing tools
      if: runner.os == 'Linux'
      run: python -m pip install twine
    - name: Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: make -f Makefile.dist upload

